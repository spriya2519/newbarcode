<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today’s Attendance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mut:#64708a;--line:#e1e6ef;
--pre:#1f9d6b;--abs:#d64550;--per:#e8a317;--off:#2f6fed;--chip:#eaeff7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#eaf0ff;--mut:#97a3bf;--line:#26304d;--chip:#222c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#eaf0ff;--mut:#97a3bf;--line:#26304d;--chip:#222c47;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:16px}
h1{font-size:1.5rem;margin:0;font-weight:800;letter-spacing:-.02em}
.date{color:var(--mut);font-size:.9rem}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.15)}
button:focus-visible,input:focus-visible{outline:3px solid var(--off);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;border-left:6px solid var(--c)}
.kpi.on{outline:2px solid var(--c)}
.kpi b{display:block;font-size:2.2rem;font-weight:800;line-height:1.1;margin-top:4px}
.kpi span{font-size:.85rem;color:var(--mut);font-weight:500}
.kpi small{color:var(--mut)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:12px;margin-bottom:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:1rem;margin:0 0 12px;font-weight:700}
.donut{width:180px;height:180px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center}
.donut div{width:116px;height:116px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--mut)}
.donut strong{display:block;font-size:1.9rem;color:var(--ink);line-height:1}
.legend{display:grid;gap:6px;font-size:.85rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.legend div{display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:inherit;text-align:left}
.row.on{font-weight:700}
.bar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--chip)}
.bar i{display:block}
.row em{font-style:normal;text-align:right;font-size:.8rem;color:var(--mut)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:200px}
.tw{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px;position:sticky;top:0;background:var(--card)}
td{padding:8px;border-top:1px solid var(--line)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:700;color:#fff}
.note{color:var(--mut);font-size:.8rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Today’s Attendance</h1><div class="date" id="date"></div></div>
  <div class="seg" role="group" aria-label="Group by">
    <button data-v="cat" class="on">By category</button><button data-v="dept">By department</button>
  </div>
</header>
<section class="kpis" id="kpis"></section>
<section class="grid">
  <div class="card"><h2>Overall status</h2><div class="donut" id="donut"><div><span><strong id="tot"></strong>employees</span></div></div><div class="legend" id="legend"></div></div>
  <div class="card"><h2 id="gt">Status by category</h2><div id="rows"></div></div>
</section>
<section class="card">
  <div class="tools"><h2 id="lt" style="margin:0">Employees</h2><input id="q" type="search" placeholder="Search name or ID" aria-label="Search employees"></div>
  <div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Department</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note">Sample data shown. Tap a card, a row or a chart bar to filter the list.</p>
</section>
</div>
<script>
const S={present:{l:"Present",c:"--pre"},absent:{l:"Absent",c:"--abs"},personal:{l:"Personal out",c:"--per"},official:{l:"Movement order / official visit",c:"--off"}};
const CATS=["GM","DGM","AGM","Manager","Executive","Staff"],CN=[3,8,12,28,34,45];
const DEPTS=["Finance","HR","Operations","IT","Projects","Admin"];
const FN=["Anil","Suresh","Meena","Ravi","Priya","Kiran","Deepa","Arjun","Neha","Vijay","Sunita","Rahul","Asha","Manoj","Lata","Sanjay"],LN=["Sharma","Reddy","Nair","Patel","Singh","Das","Iyer","Gupta","Rao","Khan"];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const E=[];let id=1000;
CATS.forEach((c,i)=>{for(let k=0;k<CN[i];k++){const r=rnd();
E.push({id:"E"+(id++),n:FN[Math.floor(rnd()*FN.length)]+" "+LN[Math.floor(rnd()*LN.length)],cat:c,dept:DEPTS[Math.floor(rnd()*6)],
s:r<.7?"present":r<.82?"absent":r<.91?"personal":"official"})}});
let view="cat",f=null,g=null,q="";
const $=id=>document.getElementById(id),cv=n=>`var(${S[n].c})`;
const cnt=l=>{const o={present:0,absent:0,personal:0,official:0};l.forEach(e=>o[e.s]++);return o};
$("date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function render(){
  const all=cnt(E),T=E.length;
  $("tot").textContent=T;
  $("kpis").innerHTML=Object.keys(S).map(k=>`<button class="kpi${f===k?" on":""}" style="--c:${cv(k)}" data-f="${k}"><span>${S[k].l}</span><b>${all[k]}</b><small>${Math.round(all[k]/T*100)}% of staff</small></button>`).join("");
  let a=0;$("donut").style.background="conic-gradient("+Object.keys(S).map(k=>{const s=a;a+=all[k]/T*100;return `${cv(k)} ${s}% ${a}%`}).join(",")+")";
  $("legend").innerHTML=Object.keys(S).map(k=>`<div><span><i style="background:${cv(k)}"></i>${S[k].l}</span><b>${all[k]}</b></div>`).join("");
  const keys=view==="cat"?CATS:DEPTS,fld=view==="cat"?"cat":"dept";
  $("gt").textContent="Status by "+(view==="cat"?"category":"department");
  $("rows").innerHTML=keys.map(k=>{const l=E.filter(e=>e[fld]===k),c=cnt(l),n=l.length||1;
    return `<button class="row${g===k?" on":""}" data-g="${k}"><span>${k}</span><div class="bar" title="${k}">${Object.keys(S).map(s=>`<i style="width:${c[s]/n*100}%;background:${cv(s)}"></i>`).join("")}</div><em>${c.present}/${l.length} in</em></button>`}).join("")+
    `<div class="note">Each bar shows present, absent, personal out and official visit. “in” = present out of total.</div>`;
  let L=E.filter(e=>(!f||e.s===f)&&(!g||e[fld]===g)&&(!q||(e.n+e.id).toLowerCase().includes(q)));
  $("lt").textContent=`Employees (${L.length})`+(f||g?" · filtered":"");
  $("tb").innerHTML=L.map(e=>`<tr><td>${e.id}</td><td>${e.n}</td><td>${e.cat}</td><td>${e.dept}</td><td><span class="tag" style="background:${cv(e.s)}">${S[e.s].l}</span></td></tr>`).join("")||`<tr><td colspan="5">No employees match. Clear a filter to see everyone.</td></tr>`;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.v){view=b.dataset.v;g=null;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b))}
  else if(b.dataset.f)f=f===b.dataset.f?null:b.dataset.f;
  else if(b.dataset.g)g=g===b.dataset.g?null:b.dataset.g;
  render()});
$("q").addEventListener("input",e=>{q=e.target.value.toLowerCase();render()});
render();
</script>
</body>
</html>
